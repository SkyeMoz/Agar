<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DropLoot.io</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE THEME
========================= */

:root{

--bg: #e9ecf1;

--glass: rgba(255,255,255,0.55);
--glass-strong: rgba(255,255,255,0.75);

--border: rgba(255,255,255,0.65);

--text: #0f172a;
--muted: #6b7280;

--accent: #2563eb;

}

/* ========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:linear-gradient(
180deg,
#eef1f6,
#e6e9ef
);

color:var(--text);

min-height:100vh;

padding-bottom:90px;

}

/* =========================
   GLASS CARD
========================= */

.glass{

background:var(--glass);

backdrop-filter: blur(18px);

border-radius:24px;

border:1px solid var(--border);

box-shadow:
0 8px 24px rgba(0,0,0,0.06);

}

/* =========================
   HERO
========================= */

.hero{

padding:60px 24px 20px;

text-align:center;

}

.icon{

width:100px;
height:100px;

margin:auto;

border-radius:26px;

background:linear-gradient(
145deg,
#f8fafc,
#e5e7eb
);

box-shadow:
0 6px 18px rgba(0,0,0,0.12);

margin-bottom:20px;

}

.title{

font-size:32px;
font-weight:800;

margin-bottom:8px;

}

.subtitle{

font-size:15px;

color:var(--muted);

max-width:420px;

margin:auto;

}

/* =========================
   BUTTONS
========================= */

.launchBtn{

margin-top:28px;

padding:16px 28px;

border-radius:16px;

border:none;

background:var(--accent);

color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.2s;

box-shadow:
0 6px 14px rgba(37,99,235,0.25);

}

.launchBtn:hover{

transform:translateY(-1px);

}

/* =========================
   VERSION CARD
========================= */

.versionCard{

margin:30px 20px;

padding:20px;

}

select{

width:100%;

padding:14px;

border-radius:14px;

border:1px solid rgba(0,0,0,.08);

background:white;

font-size:14px;

}

/* =========================
   FEATURES
========================= */

.section{

padding:20px;

}

.sectionTitle{

font-size:20px;
font-weight:700;

margin-bottom:16px;

}

.featureGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

.featureCard{

padding:18px;

}

/* =========================
   SCREENSHOTS
========================= */

.mediaGrid{

display:flex;

gap:14px;

overflow-x:auto;

padding-bottom:10px;

}

.mediaItem{

min-width:180px;

height:120px;

background:#d1d5db;

border-radius:18px;

}

/* =========================
   CREATOR
========================= */

.creator{

margin:20px;

padding:22px;

text-align:center;

}

.creator h3{

font-size:18px;
font-weight:700;

margin-bottom:6px;

}

.creator p{

font-size:14px;

color:var(--muted);

}

/* =========================
   BOTTOM NAVIGATION
========================= */

.bottomNav{

position:fixed;

bottom:16px;
left:50%;

transform:translateX(-50%);

width:92%;

max-width:420px;

padding:10px;

display:flex;

justify-content:space-around;

z-index:50;

}

.navItem{

flex:1;

text-align:center;

font-size:12px;

color:var(--muted);

cursor:pointer;

}

.navIcon{

width:34px;
height:34px;

margin:auto;

border-radius:12px;

display:flex;

align-items:center;
justify-content:center;

}

.navActive{

background:var(--accent);

color:white;

}

/* =========================
   MODALS
========================= */

.modal{

position:fixed;

inset:0;

display:none;

align-items:center;
justify-content:center;

background:rgba(0,0,0,0.3);

backdrop-filter: blur(8px);

z-index:100;

}

.modalCard{

padding:26px;

width:280px;

text-align:center;

}

.platformBtn{

width:100%;

padding:14px;

margin-top:10px;

border-radius:14px;

border:none;

background:#f1f5f9;

cursor:pointer;

font-weight:600;

}

/* =========================
   LOADING
========================= */

.loader{

width:48px;
height:48px;

border-radius:50%;

border:4px solid #e5e7eb;

border-top:4px solid var(--accent);

margin:auto;

animation:spin 1s linear infinite;

margin-bottom:16px;

}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

.progress{

width:100%;

height:10px;

background:#e5e7eb;

border-radius:999px;

overflow:hidden;

margin-top:10px;

}

.progressFill{

height:100%;

width:0%;

background:var(--accent);

}

</style>
</head>

<body>

<!-- HERO -->

<div class="hero">

<div class="icon"></div>

<div class="title">
DropLoot.io
</div>

<div class="subtitle">
Eat. Grow. Dominate. Become the biggest circle.
</div>

<button class="launchBtn"
onclick="openPlatform()">

Launch Game

</button>

</div>

<!-- VERSION -->

<div class="glass versionCard">

<div class="sectionTitle">
Versions
</div>

<select id="versionSelect">

<option>Loading...</option>

</select>

</div>

<!-- FEATURES -->

<div class="section">

<div class="sectionTitle">
Features
</div>

<div class="featureGrid">

<div class="glass featureCard">
Smooth Gameplay
</div>

<div class="glass featureCard">
Modern UI
</div>

<div class="glass featureCard">
Bot Battles
</div>

<div class="glass featureCard">
Upgrade System
</div>

</div>

</div>

<!-- MEDIA -->

<div class="section
